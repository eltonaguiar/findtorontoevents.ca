# Deploy Algorithm Competition Arena to findtorontoevents.ca via FTP
# Uploads dashboard HTML, JSON data, and updates page to the live site
name: Deploy Competition to Live Site

on:
  workflow_dispatch:  # Manual trigger
  workflow_run:
    workflows: ["Algorithm Competition Refresh"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy competition files to live site via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo "=== Deploying Algorithm Competition Arena to findtorontoevents.ca ==="

          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::FTP credentials not configured. Skipping deploy."
            echo "Set FTP_SERVER, FTP_USER, FTP_PASS in repository secrets to enable."
            exit 0
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1

          REMOTE_BASE="/findtorontoevents.ca"

          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" << FTPEOF
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3

          # Create directories
          mkdir -p $REMOTE_BASE/STOCKS/competition
          mkdir -p $REMOTE_BASE/STOCKS

          # Upload competition dashboard and data
          cd $REMOTE_BASE/STOCKS/competition
          put STOCKS/competition/index.html
          put STOCKS/competition/competition-slim.json
          put STOCKS/competition/competition-stocks.json
          put STOCKS/competition/competition-crypto.json
          put STOCKS/competition/competition-forex.json
          put STOCKS/competition/competition-penny_stocks.json
          put STOCKS/competition/competition-meme_coins.json

          # Upload simulation mode page
          cd $REMOTE_BASE/STOCKS
          put STOCKS/algorithm-competition.html

          # Upload updated updates page
          cd $REMOTE_BASE/updates
          put updates/index.html

          echo "Upload complete"
          bye
          FTPEOF

          if [ $? -eq 0 ]; then
            echo "=== Deployed successfully ==="
            echo "Dashboard:  https://findtorontoevents.ca/STOCKS/competition/"
            echo "Simulation: https://findtorontoevents.ca/STOCKS/algorithm-competition.html"
            echo "Updates:    https://findtorontoevents.ca/updates/"
          else
            echo "::warning::FTP upload failed"
          fi
